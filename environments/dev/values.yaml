# =============================================================================
# File        : environments/dev/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - values files; Unit IV 4.3 - environments
# Purpose     : Everything that differs in dev, and nothing else. Read by
#               argocd/applications/tasktracker-dev.yaml from the tip of main,
#               so a merged change to this file is deployed within a minute.
# =============================================================================
environment: dev

# C3: created in dso202-dev by the Sealed Secrets controller from
# platform/dev/tasktracker-credentials.sealed.yaml.
existingSecret: tasktracker-credentials

# C1: the release is these tags. Baseline images are 1.0.
database:
  image:
    tag: "1.0"

backend:
  replicaCount: 1
  image:
    # Stand-in 1.1 image built from stand-in-images/backend (tutor-approved).
    repository: dso202-local/dso202-backend
    tag: "1.1"
  # C2: backend 1.1 exits at start-up without DB_POOL_MAX (Task 7, step 6:
  # "[config] FATAL: required environment variable DB_POOL_MAX is not set").
  # Merged into the chart's backend.config and rendered into backend-config.
  config:
    DB_POOL_MAX: "10"

frontend:
  replicaCount: 1
  image:
    # Stand-in 1.1 image built from stand-in-images/frontend (tutor-approved).
    repository: dso202-local/dso202-frontend
    tag: "1.1"
  service:
    # C10: mapped to http://localhost:30080 by cluster/kind-cluster.yaml.
    nodePort: 30080
