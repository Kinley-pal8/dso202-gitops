# =============================================================================
# File        : environments/staging/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - values files; Unit IV 4.3 - environments
# Purpose     : Everything that differs in staging, and nothing else. Read by
#               argocd/applications/tasktracker-staging.yaml from a Git TAG, so
#               editing this file on main changes nothing in staging until the
#               tag in that Application is moved and a person syncs.
# =============================================================================
environment: staging

# C3: created in dso202-staging by the Sealed Secrets controller from
# platform/staging/tasktracker-credentials.sealed.yaml (sealed separately,
# with a different password from dev).
existingSecret: tasktracker-credentials

# C1: the release is these tags. Baseline images are 1.0.
database:
  image:
    tag: "1.0"

backend:
  replicaCount: 1
  image:
    # Stand-in 1.1 image built from stand-in-images/backend (tutor-approved).
    repository: dso202-local/dso202-backend
    tag: "1.1"

frontend:
  replicaCount: 1
  image:
    # Stand-in 1.1 image built from stand-in-images/frontend (tutor-approved).
    repository: dso202-local/dso202-frontend
    tag: "1.1"
  service:
    # C10: not mapped by kind; reached with kubectl port-forward (Task 5).
    nodePort: 30081
