# =============================================================================
# File        : platform/staging/tasktracker-credentials.sealed.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.5.3 - Secrets; Unit IV 4.3 - Sealed Secrets
# Purpose     : The database credentials of the staging environment, encrypted
#               with the public key of this cluster's Sealed Secrets
#               controller (output of kubeseal, safe to commit). The controller
#               decrypts it into the Secret 'tasktracker-credentials' in
#               dso202-staging, which the chart reads through existingSecret (C3).
# Scope       : strict (default). Name and namespace are part of the
#               ciphertext: this file cannot be decrypted under another name,
#               in another namespace, or by another cluster's key.
# Generated   : kubectl create secret generic ... --dry-run=client -o yaml
#               | kubeseal --format yaml   (Task 4, step 4)
# =============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tasktracker-credentials
  namespace: dso202-staging
spec:
  encryptedData:
    DB_PASSWORD: 
    DB_USER: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: tasktracker-credentials
      namespace: dso202-staging
