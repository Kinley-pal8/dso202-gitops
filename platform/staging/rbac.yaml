# =============================================================================
# File        : platform/staging/rbac.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit II 2.3 - Kubernetes RBAC (carried over from Assignment 2)
# Purpose     : The namespace-scoped read-only identity from Assignment 2: a
#               'viewer' ServiceAccount, a Role that reads workloads (never
#               Secrets), and the RoleBinding that joins them.
#
# This is Kubernetes RBAC: it controls what an identity may do through the
# Kubernetes API. It is unrelated to Argo CD RBAC (bootstrap/argocd/
# argocd-rbac-cm-patch.yaml), which controls what an Argo CD user may do.
#
# Not carried over from Assignment 2:
#   - backend-sa: rendered by the chart (charts/tasktracker/templates/
#     backend.yaml) because the backend Deployment refers to it.
#   - The ClusterRoles, ClusterRoleBinding and aggregated ClusterRole: they
#     are cluster-scoped, and this file is per environment. They served the
#     Assignment 2 RBAC demonstration and nothing in this assignment uses them.
#   - The DbBackup operator's ServiceAccount and Role: the operator is not
#     deployed in this assignment.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: dso202-staging
  labels:
    app: task-tracker
    dso202/environment: staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-readonly
  namespace: dso202-staging
  labels:
    app: task-tracker
    dso202/environment: staging
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Secrets are deliberately absent: a read-only viewer has no business
  # reading credentials.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-namespace-readonly
  namespace: dso202-staging
  labels:
    app: task-tracker
    dso202/environment: staging
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: dso202-staging
roleRef:
  kind: Role
  name: namespace-readonly
  apiGroup: rbac.authorization.k8s.io
